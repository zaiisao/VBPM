[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbpm"
version = "0.1.0"
description = "VBPM: a variational bar-pointer model on frozen fold-honest frontends"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "numpy",
    "scipy",
    "soundfile",
    "mir_eval",
    "pyyaml",
    "pandas",
    "pytorch-lightning",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["vbpm", "vbpm.data", "vbpm.frontends", "vbpm.util", "vbpm.scoring",
            "musicfm", "musicfm.model", "musicfm.modules"]
package-dir = {musicfm = "external/musicfm"}

[tool.setuptools.package-data]
vbpm = ["config_schema.json"]
