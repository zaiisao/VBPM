# The vbpm environment. Create + install (from the repo root):
#
#     conda env create -f environment.yml          # or: conda create -n vbpm python=3.10 pip
#     conda run -n vbpm pip install -e . -e ./external/beat_this
#
# Editable installs make `import vbpm`, `import beat_this`, and `import musicfm` resolve
# to this checkout (edits reflect immediately, no sys.path hacks).
# On this machine the env lives at /disk4/anaconda3/envs/vbpm.
name: vbpm
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchaudio==2.6.0+cu124   # beat_this loads audio through it
      - numpy
      - scipy
      - soundfile                 # audio I/O in the frontend pass
      - pandas                    # Beat This dataset loader
      - pytorch-lightning         # Beat This dataset loader
      - mir_eval                  # beat/downbeat F-measure
      - einops                    # beat_this
      - transformers<5            # MusicFM's Wav2Vec2 conformer encoder
      - rotary_embedding_torch    # beat_this
      - soxr                      # beat_this resampling
      - mido                      # madmom (beat_this transitive) needs it at import
      - pytest                    # the acceptance suite
      - ruff                      # style enforcement (ruff.toml)
